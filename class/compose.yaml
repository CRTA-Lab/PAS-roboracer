# F1TENTH class environment (ROS 2 Jazzy).
#
#   docker compose up -d              # lab from .env (LAB=...)
#   LAB=lab2_week6 docker compose up -d
#   docker compose exec lab bash      # where you work
#
# sim   - the simulator; starts by itself, you never need to open it
# lab   - this week's exercise; your copy lives in ./work/<LAB>
# novnc - RViz in the browser: http://localhost:8080/vnc.html

services:
  sim:
    image: ${REGISTRY:-ghcr.io/crta-lab}/f1tenth-sim:${SIM_TAG:-jazzy}
    # Wait (up to 60 s) for noVNC's X server on novnc:6000 so RViz can open.
    command:
      - bash
      - -c
      - |
        for i in $$(seq 60); do (exec 3<>/dev/tcp/novnc/6000) 2>/dev/null && break; sleep 1; done
        exec ros2 launch f1tenth_gym_ros gym_bridge_launch.py open_foxglove:=false
    ports:
      # foxglove_bridge websocket (optional): ws://localhost:8765
      - "8765:8765"
    environment:
      - DISPLAY=novnc:0.0
    depends_on:
      - novnc
    networks:
      - ros

  lab:
    image: ${REGISTRY:-ghcr.io/crta-lab}/f1tenth-lab:${LAB:?set LAB in .env, e.g. LAB=lab1_week5}
    volumes:
      - ./work/${LAB}:/lab_ws
    environment:
      - DISPLAY=novnc:0.0
    depends_on:
      - sim
    networks:
      - ros
    stdin_open: true
    tty: true

  novnc:
    image: theasp/novnc:latest
    platform: linux/amd64
    environment:
      - DISPLAY_WIDTH=1728
      - DISPLAY_HEIGHT=972
    ports:
      - "8080:8080"
    networks:
      - ros

networks:
  ros:
