# Instructor overlay: build a lab image locally instead of pulling it.
#
#   docker compose -f compose.yaml -f compose.build.yaml build lab
#   LAB=lab2_week6 docker compose -f compose.yaml -f compose.build.yaml build lab
#
# Uses the f1tenth-base image you built in the simulator repo (or pulled).

services:
  lab:
    build:
      context: .
      dockerfile: docker/lab.Dockerfile
      args:
        LAB: ${LAB}
        BASE_IMAGE: ${REGISTRY:-ghcr.io/crta-lab}/f1tenth-base:${SIM_TAG:-jazzy}
