# Instructor compose file: builds and pushes the class images.
#
#   docker compose build                  # native arch (arm64 on Apple Silicon)
#   docker/build-platform.sh linux/amd64  # amd64 on a Mac (emulated; not via compose)
#   docker compose up -d                  # sim + noVNC, for working on the simulator
#   docker compose --profile build push base sim   # to ${REGISTRY} (CI does this)
#
# Students never use this file: ../class/compose.yaml pulls
# ${REGISTRY}/f1tenth-sim and runs it next to that week's f1tenth-lab image.

services:
  # Layer 1: ROS 2 base. Build-only; it has no long-running process.
  base:
    image: ${REGISTRY:-ghcr.io/crta-lab}/f1tenth-base:${TAG:-jazzy}
    build:
      context: ./docker
      dockerfile: base.Dockerfile
    profiles: [build]

  # Layer 2: simulator, built FROM the base service above.
  sim:
    image: ${REGISTRY:-ghcr.io/crta-lab}/f1tenth-sim:${TAG:-jazzy}
    build:
      context: ./
      additional_contexts:
        base: service:base
      args:
        GYM_REF: ${GYM_REF:-dev-jax}
    ports:
      # foxglove_bridge websocket: connect Foxglove to ws://localhost:8765
      - "8765:8765"
    environment:
      - DISPLAY=novnc:0.0
    depends_on:
      - novnc
    networks:
      - x11
    stdin_open: true
    tty: true
  # RViz-in-browser: http://localhost:8080/vnc.html (starts together with sim)
  novnc:
    image: theasp/novnc:latest
    platform: linux/amd64
    environment:
      - DISPLAY_WIDTH=1728
      - DISPLAY_HEIGHT=972
    ports:
      - "8080:8080"
    networks:
      - x11
networks:
  x11:
