name: Lab images

# One image per folder in class/labs/:
#   class/labs/<lab>/ -> ghcr.io/<owner>/f1tenth-lab:<lab>
# Built for linux/amd64 on top of ghcr.io/<owner>/f1tenth-base:jazzy.
# Runs when class/ changes on main, and after every successful simulator build
# on main (so all labs sit on the current base and share its layers).
# Pull requests build and test only.

on:
  push:
    branches: [ main ]
    paths: [ 'class/**', '.github/workflows/labs.yml' ]
  pull_request:
    paths: [ 'class/**', '.github/workflows/labs.yml' ]
  workflow_run:
    workflows: [ 'Simulator images' ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  list:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: class
    outputs:
      labs: ${{ steps.labs.outputs.labs }}
    steps:
      - uses: actions/checkout@v4
      - id: labs
        run: echo "labs=$(ls -d labs/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  lab:
    needs: list
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: class
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJson(needs.list.outputs.labs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set registry
        run: |
          owner='${{ github.repository_owner }}'
          echo "REGISTRY=ghcr.io/${owner,,}" >> "$GITHUB_ENV"

      # Also needed to pull the base while its GHCR package is still private.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build -f docker/lab.Dockerfile \
            --build-arg LAB=${{ matrix.lab }} \
            --build-arg BASE_IMAGE="$REGISTRY/f1tenth-base:jazzy" \
            -t "$REGISTRY/f1tenth-lab:${{ matrix.lab }}" .

      - name: Check the example builds and its packages are found
        run: |
          docker run --rm "$REGISTRY/f1tenth-lab:${{ matrix.lab }}" \
            bash -c 'ros2 pkg list | grep -f <(ls /opt/lab_ws/src)'

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push "$REGISTRY/f1tenth-lab:${{ matrix.lab }}"
